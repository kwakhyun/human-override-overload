<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전투 그래픽 검수 · HUMAN OVERRIDE</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#091019;color:#e6f2ff;font:15px system-ui,sans-serif}header{max-width:1280px;margin:auto}h1{font-size:28px;margin:0 0 12px}p{color:#a5b9cc;line-height:1.7}nav{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#091019ef;padding:14px 0;z-index:1}button,select{background:#172534;color:#e6f2ff;border:1px solid #385165;border-radius:7px;padding:10px;font:inherit}button{cursor:pointer}main{max-width:1280px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}article{background:#111d2a;border:1px solid #29394c;border-radius:12px;padding:14px}h2{margin:30px 0 16px;font-size:21px}h3{font-size:15px;margin:0 0 8px}canvas{width:100%;aspect-ratio:1;background:radial-gradient(#24384a,#0c1420);border-radius:8px}small{display:block;color:#92adc4;line-height:1.6;margin-top:8px}.light canvas{background:#cbd4dd}.compact canvas{max-height:140px;object-fit:contain}a{color:#88dfff}label{display:flex;align-items:center;gap:8px}
</style><header><h1>전투 그래픽 검수</h1><p>인게임에 연결된 전체 프레임을 재생합니다. 카드별 슬라이더로 동작을 고정할 수 있습니다. 보스의 변형·파괴 행도 검수에 포함합니다.</p><nav><button id="play">일시 정지</button><button id="bg">밝은 배경</button><label>시점<select id="direction"><option value="0">정면</option><option value="1">우측 전면</option><option value="2">오른쪽</option><option value="3">우측 후면</option><option value="4">뒷면</option><option value="5">좌측 후면</option><option value="6">왼쪽</option><option value="7">좌측 전면</option></select></label><label>품질<select id="profile"><option value="">기본</option><option value="performance/">모바일</option></select></label><a href="/">게임으로</a></nav></header><main id="main"></main>
<script type="module">
const data=[
 ['전투원 공통 비율', ['aegis-operative','aegis-sword-operative','mika-operative','vesper-operative','nox-operative'],8,8,'hero'],
 ['캐릭터별 Q · E · F · R', ['aegis-skills','sword-manual-skills','mika-skills','vesper-skills','nox-skills'],6,4,'vfx'],
 ['자동 스킬과 보스 이펙트', ['automatic-skills','sword-auto-skills','boss-patterns','regional-patterns'],6,4,'vfx'],
 ['외곽 적과 중간보스', ['neon-foundry-enemies','storm-spire-enemies','gene-vault-enemies'],6,4,'enemy'],
 ['권역 보스', ['wrong-engine-core-boss','glass-dune-boss','abyssal-archive-boss','neon-foundry-boss','storm-spire-boss','gene-vault-boss'],6,4,'boss'],
 ['일반 적 · 방어전', ['rifleman','sniper','siege-walker','defense-towers','defense-directions'],6,4,'unit'],
];
const names={'aegis-operative':'이지스','aegis-sword-operative':'이지스 · 검','mika-operative':'미카','vesper-operative':'베스퍼','nox-operative':'녹스'};
const definitions=await fetch('/tools/combat-sprite-index.json',{cache:'no-store'}).then(r=>r.json());
const records=[];let playing=true,clock=0,last=performance.now();
for(const [heading,ids,columns,rows,kind] of data){const h=document.createElement('h2');h.textContent=heading;main.append(h);const grid=document.createElement('div');grid.className='grid';main.append(grid);
 for(const id of ids){const card=document.createElement('article');const title=document.createElement('h3');title.textContent=names[id]||id;card.append(title);const canvas=document.createElement('canvas');canvas.width=canvas.height=256;card.append(canvas);const note=document.createElement('small');note.textContent=kind==='hero'?'공통 프레임 · 8방향 / 이동·공격':kind==='boss'?'고정 시점 · 단계별 준비·발사·회복':'행별 동작 순환';card.append(note);grid.append(card);const img=new Image();const def=definitions.find(d=>d.id===id);if(!def)throw Error('Missing atlas '+id);const slider=document.createElement('input');slider.type='range';slider.min='0';slider.max=String(def.columns*def.rows-1);slider.style.width='100%';slider.setAttribute('aria-label',id+' frame');card.append(slider);const reset=document.createElement('button');reset.textContent='자동';card.append(reset);card.dataset.sprite=id;const rec={...def,kind,img,canvas,note,slider,fixed:null};slider.oninput=()=>rec.fixed=Number(slider.value);reset.onclick=()=>rec.fixed=null;records.push(rec);}
}
function load(){for(const r of records)r.img.src='/assets/overload/quality-v3/'+profile.value+r.id+'.png?v='+r.version}
load();profile.onchange=load;play.onclick=()=>{playing=!playing;play.textContent=playing?'일시 정지':'재생'};bg.onclick=()=>{document.body.classList.toggle('light');bg.textContent=document.body.classList.contains('light')?'어두운 배경':'밝은 배경'};
function render(now){if(playing)clock+=(now-last)/1000;last=now;for(const r of records){if(!r.img.complete||!r.img.naturalWidth)continue;const ctx=r.canvas.getContext('2d');ctx.clearRect(0,0,256,256);const frame=r.fixed??(r.kind==='hero'?Number(direction.value)*r.columns+Math.floor(clock*7)%r.columns:Math.floor(clock*5)%(r.columns*r.rows));const row=Math.floor(frame/r.columns),col=frame%r.columns;r.slider.value=String(frame);r.note.textContent=`${row+1}행 ${col+1}열 · ${frame+1}/${r.rows*r.columns} 프레임`;const w=r.img.naturalWidth/r.columns,h=r.img.naturalHeight/r.rows;ctx.drawImage(r.img,col*w,row*h,w,h,0,0,256,256);}requestAnimationFrame(render)}requestAnimationFrame(render);
window.__spriteReview={setFrame(id,index){const r=records.find(r=>r.id===id);if(!r||index<0||index>=r.rows*r.columns)throw Error('Invalid frame');r.fixed=index},getFrames(){return records.map(({id,rows,columns,img})=>({id,rows,columns,ready:img.complete&&!!img.naturalWidth}))}};
</script></html>
