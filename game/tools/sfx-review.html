<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUMAN OVERRIDE 효과음 청음</title>
<style>body{margin:32px;background:#101723;color:#edf5ff;font:16px system-ui;max-width:1100px}h1{font-size:26px}p{color:#c4d0df}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}button{background:#20334b;color:#fff;border:1px solid #7494b6;border-radius:10px;padding:18px;cursor:pointer;font:inherit}button:hover{background:#345172}label{display:block;margin:24px 0}</style>
<h1>HUMAN OVERRIDE · 효과음 청음</h1><p>버튼을 누르면 게임에 연결된 효과음이 재생됩니다. 음량을 낮게 시작하세요.</p>
<label>청음 음량 <input id="volume" type="range" min="0" max="1" step=".05" value=".5"></label><p id="status">재생할 효과음을 선택하세요.</p><main></main>
<script type="module">
import { createSfxEngine } from '/src/audio/sfx.js';
import { SFX_SAMPLES } from '/src/audio/sfxSamples.js';
const engine=createSfxEngine();engine.setVolume(.5);
const labels={shoot:'AEGIS 소총',sword:'빔 소드',mikaShot:'MIKA 광륜',vesperShot:'VESPER 니들',noxShot:'NOX 투사체',dash:'대시',enemyHit:'적 명중',playerHit:'플레이어 피격',kill:'적 파괴',shield:'보호막 전개',shieldHit:'보호막 피격',emp:'EMP',arc:'전격',rail:'레일건',explosion:'폭발',boss:'보스 등장',bossBreak:'보스 장갑 파괴',bossDeath:'보스 격파',bossTelegraph:'위험 예고',towerShot:'포탑 발사',enemyShot:'적 사격',spawnGate:'전송 관문',collect:'아이템 획득',victory:'승리',uiHover:'버튼 가리키기',uiConfirm:'확인',uiClose:'닫기',click:'클릭'};
for(const name of Object.keys(SFX_SAMPLES)){const b=document.createElement('button');b.textContent=labels[name]||name;b.onclick=async()=>{document.querySelector('#status').textContent='효과음 준비 중…';await engine.start();engine.play(name);document.querySelector('#status').textContent=b.textContent;};document.querySelector('main').append(b);}
document.querySelector('#volume').oninput=e=>engine.setVolume(e.target.value);addEventListener('pagehide',()=>engine.dispose());
</script></html>
